x-analyzer-common: &analyzer-common
  restart: unless-stopped
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - ./storage:/storage
  # Analysis containers only need outbound access for package installs at build time.
  # Runtime network is intentionally left default-bridge for MVP simplicity; see docs/security.md
  # for how to lock this down further (internal: true network) once stable.

networks:
  clonedetector-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: cd-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [clonedetector-net]

  redis:
    image: redis:7-alpine
    container_name: cd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [clonedetector-net]

  # Optional object storage. STORAGE_BACKEND=local (default) skips using this.
  minio:
    # MinIO pulled minio/minio off Docker Hub (Sept 2026) — pull from their own
    # registry instead, pinned to a known-good release tag.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: cd-minio
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks: [clonedetector-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cd-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/storage
      - ./backend:/app
    ports:
      - "8000:8000"
    networks: [clonedetector-net]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    <<: *analyzer-common
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cd-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./storage:/storage
      - ./backend:/app
      - ./analyzers:/app/analyzers
      - ./scoring:/app/scoring
    command: python -m app.worker.run
    networks: [clonedetector-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cd-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [clonedetector-net]
    command: npm run dev